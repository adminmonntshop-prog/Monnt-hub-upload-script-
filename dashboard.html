<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monnt Hub - Dashboard</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    
    <!-- Supabase Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>🎉 ยินดีต้อนรับสู่ Monnt Hub</h2>
            <p id="user-info">กำลังโหลดข้อมูลผู้ใช้...</p>
            <button id="btn-logout" class="btn-auth" style="background-color: #e74c3c; color: white; margin-top: 15px;">ออกจากระบบ</button>
        </div>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        async function loadDashboard() {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "auth.html";
                return;
            }
            const user = session.user;
            const name = user.user_metadata?.full_name || user.email || 'ผู้ใช้งาน';
            document.getElementById('user-info').innerText = `เข้าสู่ระบบสำเร็จในชื่อ: ${name}`;
        }

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await window.supabaseClient.auth.signOut();
            window.location.href = "auth.html";
        });

        loadDashboard();
    </script>
</body>
</html>
