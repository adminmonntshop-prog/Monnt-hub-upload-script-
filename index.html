<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monnt Hub - Loading...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif;">
    <p>⏳ กำลังตรวจสอบระบบเข้าสู่ระบบ...</p>

    <script src="js/supabase-config.js"></script>
    <script>
        async function routeUser() {
            try {
                // เช็กว่ามีเซสชันการล็อกอินหรือไม่
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) throw error;

                if (session) {
                    window.location.href = "dashboard.html";
                } else {
                    window.location.href = "auth.html";
                }
            } catch (err) {
                console.error("Auth check failed:", err);
                // หากเกิดข้อผิดพลาด ให้ส่งไปหน้าล็อกอิน auth.html ทันที
                window.location.href = "auth.html";
            }
        }

        routeUser();

        // ⏱️ บังคับเปลี่ยนหน้าภายใน 2.5 วินาทีหากระบบตอบสนองช้า เพื่อไม่ให้หน้าเว็บค้าง
        setTimeout(() => {
            window.location.href = "auth.html";
        }, 2500);
    </script>
</body>
</html>
