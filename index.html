<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monnt Hub - Loading...</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background-color: #0b0f19; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif;">
    <p>⏳ กำลังตรวจสอบระบบเข้าสู่ระบบ...</p>

    <script src="js/supabase-config.js"></script>
    <script>
        async function routeUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // หากล็อกอินอยู่แล้ว ส่งไปหน้า Dashboard ทันที
                window.location.href = "dashboard.html";
            } else {
                // หากยังไม่ได้ล็อกอิน ส่งไปหน้า Auth/Login
                window.location.href = "auth.html";
            }
        }
        routeUser();
    </script>
</body>
</html>
