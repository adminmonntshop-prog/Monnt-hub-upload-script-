<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monnt Hub - Login</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- 1. โหลด Supabase Library จาก CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 📌 ถ้าต้องการลบปุ่มรูปฟันเฟืองออก ให้ลบ 2 บรรทัดด้านล่างนี้ทิ้งได้เลยครับ -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>🔐 Monnt Hub</h2>
            <p>กรุณาเข้าสู่ระบบเพื่อจัดการและสร้างสคริปต์</p>

            <div class="auth-buttons">
                <button id="btn-google" class="btn-auth google">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">
                    เข้าสู่ระบบด้วย Google
                </button>
                <button id="btn-discord" class="btn-auth discord">
                    <img src="https://www.svgrepo.com/show/353655/discord-icon.svg" alt="Discord">
                    เข้าสู่ระบบด้วย Discord
                </button>
            </div>
        </div>
    </div>

    <!-- 2. โหลดไฟล์ตั้งค่า Supabase ก่อน (สร้าง window.supabaseClient) -->
    <script src="js/supabase-config.js"></script>
    
    <!-- 3. โหลดสคริปต์ควบคุมปุ่มเข้าสู่ระบบ -->
    <script src="js/auth.js"></script>
</body>
</html>
